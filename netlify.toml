[build]
  command = "npm run build"
  publish = ".next"

# The Next runtime plugin MUST stay declared explicitly. Netlify's auto-detection
# is not reliable here: a git build can report framework "next" yet plugin_state
# "none", publish .next as raw static files and 404 every route — while the build
# reports success. After deploying, check the deploy's function count is not 0.
[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "22"

# Never set NETLIFY_NEXT_PLUGIN_SKIP: it makes the runtime skip every lifecycle
# hook, so no serverless function is created and all API routes silently vanish.

[functions]
  node_bundler = "esbuild"

# The four original media-center renders were deleted from public/ on 2026-08-10
# and replaced by news-*.webp. They are absent from the deploy manifest, but the
# Next runtime keeps its own copy of public/ in the deploy blob store and that
# store is NOT cleared between deploys — so the old URLs kept returning 200 long
# after the files were gone, and a CDN purge did not touch them. These rules end
# that at the edge. 410 rather than 404: the removal is deliberate and permanent,
# which is what a crawler holding the old URL should be told.
# force = true is required — without it the rule loses to the asset still being
# served underneath it, which is the entire problem here.
#
# `to` MUST point at a static file, not at "/". Rewriting to a rendered route
# hands the request to the Next.js server handler, whose own 200 overrides the
# declared status — the URL then returns the full homepage under an image path,
# which is worse than the problem it was meant to fix. A plain file in public/
# is served by the CDN, so the 410 survives.
[[redirects]]
  from = "/news_smart.png"
  to = "/gone.html"
  status = 410
  force = true

[[redirects]]
  from = "/news_conference.png"
  to = "/gone.html"
  status = 410
  force = true

[[redirects]]
  from = "/news_handshake.png"
  to = "/gone.html"
  status = 410
  force = true

[[redirects]]
  from = "/news_restaurant.png"
  to = "/gone.html"
  status = 410
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/brand/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
